<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-green-400">🤖 Gmail Bot Admin Panel</h1>
            <span class="bg-green-800 text-green-200 px-3 py-1 rounded-full text-sm">Live System</span>
        </div>
        <div class="bg-gray-800 shadow-xl rounded-lg overflow-hidden border border-gray-700">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-gray-300">
                        <th class="p-4">User ID</th>
                        <th class="p-4">Name</th>
                        <th class="p-4">Balance</th>
                        <th class="p-4">Tasks Done</th>
                        <th class="p-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr class="border-b border-gray-700">
                        <td class="p-4 font-mono text-yellow-400">{{ user['user_id'] }}</td>
                        <td class="p-4">{{ user['first_name'] or 'User' }}</td>
                        <td class="p-4 text-green-400 font-bold">₹{{ user['balance'] }}</td>
                        <td class="p-4">{{ user['tasks_done'] }}</td>
                        <td class="p-4 text-center">
                            <a href="/approve/{{ user['user_id'] }}" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold text-sm">
                                Approve (+₹10)
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="p-4 text-center text-gray-400">No data found in database.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
